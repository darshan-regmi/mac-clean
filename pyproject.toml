[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "mac-clean"
version = "1.0.0"
description = "Interactive TUI cleaner for macOS caches and rebuildable files"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Darshan Regmi", email = "regmidarshan545l@gmail.com" },
]
keywords = ["macos", "cleanup", "disk-space", "tui", "curses", "homebrew"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console :: Curses",
    "Intended Audience :: Developers",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: System :: Systems Administration",
    "Topic :: Utilities",
]
dependencies = []

[project.optional-dependencies]
dev = ["ruff>=0.8"]

[project.scripts]
mac-clean = "mac_clean:main"

[project.urls]
Homepage = "https://github.com/darshan-regmi/mac-clean"
Repository = "https://github.com/darshan-regmi/mac-clean"
Issues = "https://github.com/darshan-regmi/mac-clean/issues"
Changelog = "https://github.com/darshan-regmi/mac-clean/blob/main/CHANGELOG.md"

[tool.setuptools]
py-modules = ["mac_clean"]

[tool.ruff]
target-version = "py39"
line-length = 120

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.isort]
known-first-party = ["mac_clean"]
